<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>LittleTreeHollow°</title>
    <meta name="description" content="寫給自己的日記，也可以是分享給別人的故事。在自己的小樹洞裡，把每一天寫下來。" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)" />
    <!-- 連結預覽（Instagram、LINE、Facebook、X 等）。這些服務不執行 JavaScript，
         只讀這裡的標籤，所以每個頁面的預覽都相同；圖片必須是完整網址。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LittleTreeHollow°" />
    <meta property="og:title" content="LittleTreeHollow° — 每一天，都值得寫下來" />
    <meta property="og:description" content="寫給自己的日記，也可以是分享給別人的故事。" />
    <meta property="og:url" content="https://littletreehollow.vercel.app/" />
    <meta property="og:image" content="https://littletreehollow.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LittleTreeHollow°：每一天，都值得寫下來。" />
    <meta property="og:locale" content="zh_TW" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LittleTreeHollow° — 每一天，都值得寫下來" />
    <meta name="twitter:description" content="寫給自己的日記，也可以是分享給別人的故事。" />
    <meta name="twitter:image" content="https://littletreehollow.vercel.app/og.png" />
    <!-- 網頁字體：各裝置內建的中文字體不同（iPhone 沒有宋體、Android 與 Windows 沒有蘋方），
         統一載入思源宋體與思源黑體，讓手機和電腦看到相同的字。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400..700&family=Noto+Serif+TC:wght@400..700&display=swap" />
    <script>
      // 在第一次繪製前套用外觀，避免深淺色閃爍
      (function () {
        try {
          var s = localStorage.getItem('scheme');
          if (s !== 'light' && s !== 'dark') s = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.scheme = s;
        } catch (e) {
          document.documentElement.dataset.scheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
